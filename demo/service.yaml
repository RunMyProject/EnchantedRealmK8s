apiVersion: v1
kind: Service
metadata:
  name: mykafka-service
spec:
  selector:
    app: demo-app
  ports:
    - protocol: TCP
      port: 8888  # Exposed external port
      targetPort: 7777  # Port to which it points inside your pod
      nodePort: 32283  # Specify the NodePort
  type: NodePort

